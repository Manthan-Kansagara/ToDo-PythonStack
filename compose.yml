services:
  db:
    image: postgres:17
    container_name: todo_postgres_v2
    restart: unless-stopped

    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_dev_2026_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v2: